name: Update Spain BORME Registry Data

on:
  schedule:
    - cron: "0 6 * * 1-5" # Mon-Fri 6:00 AM UTC — BORME (AEBOE) publishes a new sumario every Spanish business day, not on weekends/holidays; the script itself backtracks to the latest real publication date if a given day is a holiday
  workflow_dispatch: # Allows manual trigger

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download and Process Data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/update_spain.py

      - name: Validate output before upload
        run: |
          python -m scripts.common.validate_output spain_reg.parquet

      - name: Upload Files to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp spain_reg.parquet s3://diliguard-sanctions-test/spain_reg.parquet --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
