name: Update OpenSanctions Data

on:
  schedule:
    - cron: "0 2 * * *" # Runs every day at 2:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download and Process Data
        run: |
          python scripts/update_sanctions.py

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload Parquet to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler r2 object put diliguard-sanctions-test/targets.simple.parquet --file=targets.simple.parquet
          
      - name: Upload FTM JSON to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler r2 object put diliguard-sanctions-test/entities.ftm.json --file=entities.ftm.json
