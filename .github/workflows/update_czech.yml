name: Update Czech ARES Registry Data

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 6:00 AM UTC. NOTE: as of 2026-08, this script
                          # downloads ARES's genuine bulk export (ares_vreo_all.tar.gz,
                          # ~857MB, ~1.28M real entities), which the source itself
                          # regenerates daily — so this schedule is a deliberate choice
                          # to stay well under that cadence, not a limitation of the
                          # source. Bump to daily if fresher data is ever needed; the
                          # run itself is now a single bulk download + stream-parse
                          # (minutes, not hours), so daily would be safe to run.
  workflow_dispatch: # Allows manual trigger

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download and Process Data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/update_czech.py

      - name: Validate output before upload
        run: |
          python -m scripts.common.validate_output czech_reg.parquet

      - name: Upload Files to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp czech_reg.parquet s3://diliguard-sanctions-test/czech_reg.parquet --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
